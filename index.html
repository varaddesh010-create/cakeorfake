<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CakeOrFake – check and report food adulteration</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#222;--mu:#666;--sf:#f5f5f5;--ln:#ddd;--lk:#2a6cb0;--rd:#b3321f;--gn:#2b7a2b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181a18;--tx:#e8e8e8;--mu:#a5a5a5;--sf:#242724;--ln:#3a3d3a;--lk:#7db8ec;--rd:#ff8e7c;--gn:#7bd67b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181a18;--tx:#e8e8e8;--mu:#a5a5a5;--sf:#242724;--ln:#3a3d3a;--lk:#7db8ec;--rd:#ff8e7c;--gn:#7bd67b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Poppins,"Noto Sans Devanagari",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#222;z-index:10}
.w{max-width:960px;margin:0 auto;padding:0 15px}
nav{background:#222;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
nav .w{display:flex;align-items:center;gap:2px;overflow-x:auto}
nav b{color:#9a9a9a;padding:0 12px 0 0;font-size:18px;white-space:nowrap}
nav button{background:none;border:0;color:#9d9d9d;font:inherit;padding:15px 13px;cursor:pointer;white-space:nowrap}
nav button.on{background:#000;color:#fff}
nav select{margin-left:auto;font:inherit;padding:4px;border-radius:3px;border:0}
.hero{background:#9acd32;color:#1c3300;padding:44px 0 38px}
.hero h1{font-size:clamp(38px,9vw,64px);margin:0 0 8px;font-weight:700;letter-spacing:-1px}
.hero p{font-size:19px;margin:0 0 20px;max-width:560px}
.btn{background:#fff;color:#222;border:1px solid #ccc;border-radius:3px;padding:7px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:#2a6cb0;color:#fff;border-color:#2a6cb0}
main{padding:24px 0 48px}
h2{font-size:30px;font-weight:500;margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid var(--ln)}
h2 small{font-size:65%;color:var(--mu);font-weight:400}
h3{font-size:19px;margin:0 0 4px;color:var(--lk)}
p{margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card svg{display:block;width:100%;height:auto;border-radius:4px;margin-bottom:10px}
.card p{color:var(--mu);font-size:14px}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:14px;margin-bottom:14px}
.t{border-top:1px solid var(--ln);padding:14px 0}
.t:first-child{border-top:0}
.t h3{color:var(--tx);font-size:18px}
.tag{font-size:12px;font-weight:700;border:1.5px solid;border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:middle}
.h{color:var(--gn)}.l{color:var(--rd)}
dl{margin:6px 0 0}
dt{font-weight:700;margin-top:6px}
dd{margin:0}
.ad{border-left:4px solid var(--rd);padding-left:10px;margin:0 0 10px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:flex;flex-direction:column;gap:3px}
.f.w2{grid-column:1/-1}
label{font-weight:700;font-size:14px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid #999;border-radius:3px;padding:7px 9px;width:100%}
textarea{min-height:80px}
#dr{font:13px/1.45 ui-monospace,Menlo,monospace;min-height:200px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
:focus-visible{outline:3px solid #2a6cb0;outline-offset:2px}
.er{color:var(--rd);font-size:13px}
.rep{border-top:1px solid var(--ln);padding:10px 0}
.rep:first-child{border-top:0}
.note{border-left:4px solid #9acd32;background:var(--sf);padding:10px 12px;margin:12px 0}
h1,h2,h3,nav b{font-family:"Baloo 2",Poppins,"Noto Sans Devanagari",sans-serif}
.logo{font-size:clamp(52px,14vw,92px);font-weight:800;line-height:1;letter-spacing:-1px;margin:0 0 10px}
.logo .c{color:#1c3300}.logo .o{font-size:.42em;background:#fff;color:#1c3300;border-radius:999px;padding:.05em .4em;margin:0 .18em;vertical-align:.45em;letter-spacing:0}
.logo .f{color:#8f1d0c;text-decoration:underline wavy #8f1d0c 4px;text-underline-offset:.12em}
#aq{min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.g2{grid-template-columns:1fr}}
.big{font-size:22px;line-height:1.8}
.cake{display:block;width:100%;max-width:340px;margin:0 auto 8px;border-radius:4px}
.k{animation:kreal 3.6s ease-in-out forwards}.k.kb{animation-name:kfake;animation-timing-function:ease-out}
.tp{transform-box:fill-box;transform-origin:center;animation:tpf 3.6s ease-out forwards}
.s{animation:sl 3.6s ease-in-out forwards}
.sp{opacity:0;animation:spk 3.6s linear forwards}
.jt{animation:jt 3.6s linear forwards}
@keyframes kreal{0%{transform:translateY(-64px)}45%,65%{transform:translateY(46px)}100%{transform:translateY(-64px)}}
@keyframes sl{0%,45%{transform:translateX(0)}70%,100%{transform:translateX(20px)}}
@keyframes kfake{0%{transform:translateY(-64px)}32%{transform:translateY(0)}38%{transform:translateY(-7px)}44%{transform:translateY(1px)}50%{transform:translateY(0)}72%,100%{transform:translateY(-18px)}}
@keyframes tpf{0%,50%{transform:none}70%{transform:translate(26px,-30px) rotate(140deg)}100%{transform:translate(52px,58px) rotate(330deg)}}
@keyframes spk{0%,30%{opacity:0}34%{opacity:1}56%,100%{opacity:0}}
@keyframes jt{0%,31%{transform:none}35%{transform:translateY(1.5px)}40%{transform:translateY(-1px)}45%,100%{transform:none}}
@media(prefers-reduced-motion:reduce){.k,.tp,.s,.sp,.jt{animation-duration:.01s!important}}
.res{text-align:center;border:2px solid;border-radius:4px;padding:14px;margin-top:10px}
.res.ok{border-color:var(--gn);color:var(--gn)}.res.bad{border-color:var(--rd);color:var(--rd)}
.res h3{font-size:26px;color:inherit;margin:0}.res .ic{font-size:13px;font-weight:600;color:inherit;margin:0 0 8px}.res p{color:var(--tx);font-size:14px}
[hidden]{display:none!important}
@media(max-width:700px){.g{grid-template-columns:1fr}form{grid-template-columns:1fr}.hero{padding:30px 0}}
</style>
</head>

<nav><div class="w">
 <b>Cake<i style="color:#9acd32;font-style:normal">Or</i>Fake</b>

</div></div>
<main class="w">
 <section id="p-home"><div class="panel"><h3 data-t="ak"></h3><textarea id="aq"></textarea><div class="row"><button class="btn p" onclick="ask()" data-t="ab"></button></div><div id="ao" style="white-space:pre-wrap;margin-top:10px"></div></div><h2><span id="h2a"></span> <small id="h2b"></small></h2><div class="g" id="grid"></div></section>
 <section id="p-cat" hidden></section>

  <h2 id="rh"></h2>

   <div class="f"><label for="brand" data-t="lb"></label><input id="brand" autocomplete="off"></div>

   <div class="f"><label for="di" data-t="ld"></label><input id="di" required autocomplete="off"></div>
   <div class="f"><label for="ar" data-t="la"></label><input id="ar" required autocomplete="off"></div>
   <div class="f"><label for="pin" data-t="lz"></label><input id="pin" inputmode="numeric" maxlength="6"><span class="er" id="pe"></span></div>
   <div class="f"><label for="te" data-t="lx"></label><select id="te"></select></div>
   <div class="f"><label for="rs" data-t="lr"></label><select id="rs"><option>Looks adulterated</option><option>Looks normal, but I am suspicious</option><option>Not tested yet</option></select></div>
   <div class="f w2"><label for="de" data-t="lq"></label><textarea id="de"></textarea></div>
   <div class="f w2"><button class="btn p" type="submit" data-t="sv" style="justify-self:start"></button></div>
  </form>
  <div id="db" hidden><div class="panel" style="margin-top:18px"><h3 data-t="dh"></h3>
   <textarea id="dr" aria-label="Complaint"></textarea>
   <div class="row"><button class="btn" onclick="cp()" data-t="cpy"></button><a class="btn" id="wa" target="_blank" rel="noopener" data-t="wa"></a><a class="btn" href="https://foscos.fssai.gov.in" target="_blank" rel="noopener" data-t="fs"></a></div><p id="cm" style="margin-top:8px"></p></div></div>
 </section>
 <section id="p-mine" hidden><h2 id="mh"></h2><p id="mn" style="color:var(--mu)"></p><div class="panel" id="ml"></div></section>

<section id="p-contact" hidden><h2 id="ch"></h2><div class="panel" id="cl"></div><p id="cnt" style="color:var(--mu)"></p></section>
</main>
<script>
/* AI bridge: uses Claude's built-in connection when it exists, otherwise this site's own /api/ai */
if(!window.claude){
 const b64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(b)});
 const sm=async(input,o={})=>{
  const body={prompt:typeof input==='string'?input:input.map(m=>m.content).join('\n')};
  if(o.images&&o.images[0])body.image=await b64(o.images[0]);
  const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('ai '+r.status);
  const d=await r.json();
  return {text:d.text||'',truncated:false};
 };
 sm.json=async p=>{const r=await sm(p);return JSON.parse(r.text.replace(/```json|```/g,'').trim())};
 sm.limits=async()=>({images:true});
 window.claude={use:async n=>n==='sample'?sm:null};
}
</script>

const C=[
{id:'milk',n:['Milk','दूध','दूध'],it:['Loose milk','Packet milk','Toned or skimmed milk','Cow milk','Buffalo milk'],ad:'Water, starch, soap or detergent, urea',
t:[['Water in milk','h','A tilted steel plate or tile. A spoon of milk.','Put one drop at the top of the plate. Watch how it runs down.','Pure milk runs slowly and leaves a white line. Milk with water runs fast and leaves no line.'],
['Starch in milk','h','Milk, water, iodine from a chemist shop, a small pan.','Boil half a teaspoon of milk with half a teaspoon of water. Let it cool. Add 2 drops of iodine.','If it turns blue, starch is mixed in.'],
['Soap or detergent in milk','h','A clear bottle with a lid. Milk and water.','Put 1 teaspoon of milk and 1 teaspoon of water in the bottle. Shake hard for 30 seconds. Wait one minute.','A thick foam that stays means detergent. Pure milk gives a thin foam that goes away fast.'],
['Urea or fake milk','l','','Take a sealed sample to an FSSAI-approved lab. A soapy feel is only a hint.','']]},
{id:'dairy',n:['Dairy products','दुग्ध उत्पाद','दुग्धजन्य पदार्थ'],it:['Paneer','Khoa or mawa','Curd or dahi','Buttermilk (chaas)','Butter','Cream','Cheese'],ad:'Starch, cheap fat, fake ingredients',
t:[['Starch in paneer, khoa or curd','h','A small piece of the food. Water. Iodine.','Boil the piece in water for one minute. Let it cool. Add a few drops of iodine.','Blue or purple means starch. Pure paneer or khoa stays brown.'],
['Rubbery paneer','h','A piece of paneer. A pan of hot water.','Cook the piece in hot water for 5 minutes. Then press it.','Good paneer stays soft. Very rubbery or sticky paneer is suspicious. This is only a hint.'],
['Cheap fat in butter or cheese','l','','Only a lab can find out what fat was used.','']]},
{id:'ghee',n:['Ghee','घी','तूप'],it:['Cow ghee','Buffalo ghee','Desi ghee (loose)','Packaged ghee'],ad:'Vanaspati, palm or animal fat, boiled potato',
t:[['Starch in ghee','h','A spoon of melted ghee. Warm water. Iodine.','Mix the ghee with a little warm water. Add 2 drops of iodine.','Blue colour means potato or other starch is mixed in.'],
['Cooling check','h','A spoon of ghee. A small bowl. A fridge.','Melt the ghee in the bowl. Keep it in the fridge for 30 minutes.','Pure ghee sets evenly and looks grainy. Layers or a waxy look are suspicious. This is only a hint.'],
['Vanaspati test','l','','This test uses strong acid. Do it only in a lab. A red colour means vanaspati.','']]},
{id:'oil',n:['Edible oils','खाद्य तेल','खाद्यतेल'],it:['Mustard oil','Groundnut oil','Sunflower oil','Soybean oil','Coconut oil','Sesame (til) oil','Palm oil','Refined oil'],ad:'Argemone oil, mineral oil, cheaper oil, colour',

['Smell and colour','h','A spoon of oil on a white plate.','Warm it a little. Smell it. Look at the colour.','A chemical or burnt smell, or a very bright colour, is a warning. Report it.'],
['Argemone oil in mustard oil','l','','This oil can cause a serious illness called epidemic dropsy. The test needs strong acid, so do it only in a lab.','']]},
{id:'honey',n:['Honey','शहद','मध'],it:['Branded honey','Loose honey','Forest honey','Multiflora honey'],ad:'Sugar syrup, jaggery syrup, water',

['Syrup in honey','l','','New syrups pass home tests. Only a lab can find them.','']]},
{id:'spice',n:['Spices','मसाले','मसाले'],it:['Turmeric (haldi) powder','Red chilli powder','Coriander powder','Cumin (jeera)','Black pepper','Garam masala','Hing (asafoetida)'],ad:'Harmful colours, brick powder, sawdust, chalk, papaya seeds',

['Chalk in spice powders','h','Spice powder. Vinegar or lemon juice.','Put a spoon of powder in a bowl. Add a few drops of vinegar.','If it fizzes, chalk is mixed in.'],

const I={
milk:'Milk can be mixed with water, starch, soap or detergent, and urea. Pure milk is white or creamy and a little thick. Milk with water looks thin and slightly blue. Milk with starch or detergent may look very white and foam a lot. Pure milk smells fresh and a little sweet. Fake milk may smell like soap or chemicals.',
dairy:'Paneer, khoa, curd and butter can be mixed with starch, cheap fat or fake ingredients. Pure paneer is soft, white and crumbles a little. Mixed paneer may feel rubbery or sticky. Pure khoa, curd and butter smell fresh and milky. A sour, oily or chemical smell is a warning.',
ghee:'Ghee can be mixed with vanaspati, palm or animal fat, or boiled potato. Pure ghee is golden or pale yellow and looks grainy when it sets. Mixed ghee may look too smooth, waxy or too bright yellow. Pure ghee has a rich, nutty smell. Very little smell, or a greasy smell, is a warning.',
oil:'Edible oil can be mixed with argemone oil, mineral oil, cheaper oil or colour. Good oil is clear and has the normal colour for its type. Bad oil may look cloudy, too bright or have specks in it. Mustard oil smells sharp and coconut oil smells of coconut. A chemical or burnt smell is a warning.',
honey:'Honey can be mixed with sugar syrup, jaggery syrup or water. Pure honey is thick and flows slowly in a thick stream. Fake honey may look thin, watery or too clear. Pure honey can also turn into sugar-like crystals in cold weather, so looks alone prove nothing. Pure honey smells of flowers. Fake honey may smell like plain sugar or have no smell.',
spice:'Spices can be mixed with harmful colours, brick powder, sawdust, chalk or papaya seeds. Pure spices have an even colour. Mixed spices may look too bright, feel gritty or have bits of a different colour. Pure spices smell strong and natural. A weak smell or a chemical smell is a warning.',
pulse:'Dal can be mixed with kesari dal, added colour, stones or dust. Pure dal has an even, natural colour. Coloured dal looks too bright and may stain your hands or the water. Kesari dal has wedge-shaped grains. Pure dal smells fresh and mild. A musty or chemical smell is a warning.',
tea:'Tea and coffee can be mixed with used tea leaves, colour, iron bits or chicory. Pure tea gives its colour slowly. Fake tea gives colour very fast or leaves black bits. Pure coffee is dark brown. Pure tea and coffee smell strong and fresh. A weak or burnt smell is a warning.',
sugar:'Sugar, salt and jaggery can be mixed with chalk powder, washing soda or colour. Pure sugar and salt are clean, dry and shiny. Mixed ones may look dull, powdery or lumpy. Jaggery that looks too pale or too bright is suspicious. Sugar and salt have almost no smell. Jaggery smells sweet. A chemical or soapy smell is a warning.'};

 const op=a=>a.map((x,i)=>`<option value="${i}">${E(x)}</option>`).join('');
 return `<h2>${E(cn(c))}</h2><p class="big">${E(d.inf)}</p>${note?`<p style="color:var(--mu)">${E(note)}</p>`:''}<div class="panel"><h3>${t('s1')}</h3><div class="g2"><div class="f"><label for="fi">${t('li')}</label><select id="fi" onchange="$('tsp').hidden=true;$('rs2').innerHTML=''">${c.it.map(i=>`<option>${E(i)}</option>`).join('')}</select></div><div class="f"><label for="ph">${t('ph')}</label><input id="ph" type="file" accept="image/*" onchange="pv(this)"></div><div class="f"><label for="lk">${t('lk')}</label><select id="lk">${op(t('lo'))}</select></div><div class="f"><label for="sm">${t('sm')}</label><select id="sm">${op(t('so'))}</select></div></div><img id="pi" alt="" hidden style="max-width:100%;max-height:220px;margin-top:8px;border-radius:4px"><p style="color:var(--mu);font-size:13px;margin:8px 0 0">${t('pnote')}</p><div class="row"><button class="btn p" onclick="showTests('${c.id}')">${t('pt')}</button></div></div><div class="panel" id="tsp" hidden><h3 id="th"></h3><div id="tl"></div><h3 style="margin-top:14px">${t('q3')}</h3><div class="row"><button class="btn p" onclick="yes()">${t('yes')}</button><button class="btn" onclick="judge('${c.id}')">${t('no')}</button></div><div class="row" id="fr" hidden><button class="btn p" onclick="fin('${c.id}')">${t('sr')}</button></div></div><div id="rs2"></div><div class="row"><button class="btn" onclick="go('home',1)">${t('back')}</button><button class="btn p" onclick="rep('${c.id}')">${t('rp')}</button></div>`;
}
const DC=[['Added colour in dal','h','A handful of dal. A bowl of warm water.','Soak the dal for 10 minutes. Look at the water.','Streaks of colour in the water mean colour was added.']];
const SEL={'Paneer':[0,1,2],'Cream':[2],'Cheese':[2],'Mustard oil':[1,2],'Coconut oil':[0,1],'Groundnut oil':[1],'Sunflower oil':[1],'Soybean oil':[1],'Sesame (til) oil':[1],'Palm oil':[1],'Refined oil':[1],'Turmeric (haldi) powder':[0,2,4],'Red chilli powder':[1,2,4],'Coriander powder':[2,4],'Cumin (jeera)':[2,4],'Black pepper':[3,4],'Garam masala':[2,4],'Toor or arhar dal':[0,2],'Moong dal':[1],'Chana dal':[0,2],'Besan':[2],'Tea leaves':[0,1],'Tea dust':[0,1],'Instant coffee':[2],'Coffee powder':[2],'Sugar':[0],'Salt':[0,2],'Jaggery (gur)':[1]};
const IT={'Masoor dal':DC,'Urad dal':DC,
'Khoa or mawa':[['Starch in khoa','h','A small piece of khoa. Water. Iodine.','Boil a small piece in a little water. Let it cool. Add 2 drops of iodine.','Blue or purple means starch. Pure khoa stays brown.'],['Grainy feel','h','A pinch of khoa.','Rub it between your fingers.','Pure khoa feels a little grainy and greasy. A smooth, sticky, pasty feel is suspicious. This is only a hint.'],['Cheap fat or filler','l','','Only a lab can find out.','']],
'Curd or dahi':[['Starch in curd','h','A spoon of curd. Water. Iodine.','Mix the curd with a little water in a pan and boil it. Let it cool. Add 2 drops of iodine.','Blue or purple means starch is mixed in.'],['Thickness check','h','A spoon of curd on a plate.','Tilt the plate slowly.','Pure curd slides slowly in a soft lump. Curd that is glue-like and stretchy may have starch or gelatin. Very watery curd may be diluted. This is only a hint.'],['Other fillers','l','','Only a lab can find out.','']],
'Buttermilk (chaas)':[['Starch in buttermilk','h','Half a cup of buttermilk. A small pan. Iodine.','Boil the buttermilk for one minute. Let it cool. Add 2 drops of iodine.','Blue or purple means starch is mixed in.'],['Water added to buttermilk','h','A clean steel spoon. A glass of buttermilk.','Dip the spoon in and lift it out. Look at how the buttermilk coats it.','Pure buttermilk leaves a thin white coat that stays for a moment. Very watery buttermilk runs off at once. This is only a hint.'],['Preservatives or colour','l','','Only a lab can find out.','']],
'Butter':[['Starch (mashed potato) in butter','h','A spoon of butter. Hot water. Iodine.','Melt the butter in hot water. Let it cool a little. Add 2 drops of iodine.','Blue colour means starch is mixed in.'],['Melting check','h','A spoon of butter. A clean pan on low heat.','Melt the butter on low heat. Watch it.','Pure butter melts evenly into a clear golden liquid with a little foam. Lots of spitting means too much water. A waxy look is suspicious. This is only a hint.'],['Margarine or cheap fat','l','','Only a lab can find out.','']],
'Hing (asafoetida)':[['Burn test','h','A very small lump of hing. A spoon. A flame (ask an adult).','Hold the hing on the spoon over the flame.','Pure hing burns easily with a bright flame. If it only turns black or glows, it may be mixed. This is only a hint.'],['Water test','h','A glass of water. A pinch of hing.','Stir the hing in the water.','Pure hing makes a milky white mix. Mixed hing leaves sand or sediment at the bottom.'],['Gum, resin or soapstone','l','','Only a lab can find out.','']]};
const tH=(x,i)=>`<div class="t"><h3>${E(x[0])}<span class="tag ${x[1]}">${t(x[1]==='h'?'ht':'lt')}</span></h3><dl>${x[2]?`<dt>${t('nd')}</dt><dd>${E(x[2])}</dd>`:''}<dt>${t('dd')}</dt><dd>${E(x[3])}</dd>${x[4]?`<dt>${t('sg')}</dt><dd>${E(x[4])}</dd>`:''}</dl>${x[1]==='h'?`<div class="f tsel" hidden style="margin-top:8px"><label for="tr${i}">${t('lr')}</label><select id="tr${i}" class="tr"><option value="0">${t('tn')}</option><option value="1">${t('tpn')}</option><option value="2">${t('twn')}</option></select></div>`:''}</div>`;
async function trI(it,L){
 const key='cf3i_'+lang+'_'+it;
 try{const v=localStorage.getItem(key);if(v)return JSON.parse(v)}catch(e){}
 try{
  const sm=window.claude&&await claude.use('sample');if(!sm)throw 0;
  const flat=[];L.forEach(x=>flat.push(x[0],x[2],x[3],x[4]));
  const o=await sm.json(`Translate every string in this JSON array into ${LN[lang]}. Keep names like iodine, FSSAI as they are. Empty strings stay empty. Return only a JSON array with the same length.\n`+JSON.stringify(flat));
  if(!Array.isArray(o)||o.length!==flat.length)throw 0;
  const r=L.map((x,i)=>[o[4*i],x[1],o[4*i+1],o[4*i+2],o[4*i+3]]);
  try{localStorage.setItem(key,JSON.stringify(r))}catch(e){}
  return r;
 }catch(e){return L}
}
async function showTests(id){
 const c=cat(id),it=$('fi').value;let L;
 $('rs2').innerHTML='';$('fr').hidden=true;$('th').textContent=t('tt')+': '+it;$('tl').textContent=t('tr');$('tsp').hidden=false;
 if(IT[it]){L=IT[it];if(lang!=='en')L=await trI(it,L)}
 else L=(SEL[it]||c.t.map((_,i)=>i)).map(i=>cd.t[i]);
 if($('fi').value!==it)return;
 $('tl').innerHTML=L.map(tH).join('');$('tsp').scrollIntoView({behavior:'smooth'});
}
async function open_(id,keep){
 cur=id;const c=cat(id);go('cat');
 const sec=$('p-cat');sec.insertAdjacentHTML('afterbegin','');
 const set=(d,n)=>{cd=d;if(cur===id&&page==='cat')sec.innerHTML=`<div style="margin-bottom:10px;max-width:340px">${art(id)}</div>`+view(c,d,n)};
 const en={inf:I[id],t:c.t};
 if(lang==='en'){set(en);return}
 const key='cf3_'+lang+'_'+id;
 try{const v=localStorage.getItem(key);if(v){set(JSON.parse(v));return}}catch(e){}
 set(en,t('tr'));
 try{
  const sm=window.claude&&await claude.use('sample');
  if(!sm)throw 0;
  const flat=[I[id]];c.t.forEach(x=>flat.push(x[0],x[2],x[3],x[4]));
  const o=await sm.json(`Translate every string in this JSON array into ${LN[lang]}. Keep names like iodine, FSSAI, NMR as they are. Empty strings stay empty. Return only a JSON array with the same length.\n`+JSON.stringify(flat));
  if(!Array.isArray(o)||o.length!==flat.length)throw 0;
  const d={inf:o[0],t:c.t.map((x,i)=>[o[1+4*i],x[1],o[2+4*i],o[3+4*i],o[4+4*i]])};
  try{localStorage.setItem(key,JSON.stringify(d))}catch(e){}
  set(d);
 }catch(e){set(en,t('tf'))}
}
async function ask(){
 const q=$('aq').value.trim(),o=$('ao');if(!q)return;
 o.textContent=t('tr');
 try{
  const sm=window.claude&&await claude.use('sample');if(!sm)throw 0;
  const r=await sm(`You help people in India with food adulteration. Write in ${lang==='en'?'very simple English':LN[lang]}, with short sentences and easy words, under 120 words. For the problem below: 1) say what could be wrong (use "could be", never claim it is certain), 2) give one or two safe home tests with simple steps, 3) say when to see a doctor or contact the Food Safety Officer or FSSAI. Never ask the person to taste the food. Do not diagnose illness. Problem: """${q}"""`,{modelTier:'quick'});
  o.textContent=r.text;
  const b=document.createElement('button');b.className='btn';b.textContent=t('rp2');b.style.cssText='display:block;margin-top:10px';
  b.onclick=()=>{$('de').value=q;go('report')};o.appendChild(b);
 }catch(e){o.textContent=t('af')}
}
function pv(i){const f=i.files[0],m=$('pi');$('so').textContent='';if(!f){m.hidden=true;return}m.src=URL.createObjectURL(f);m.hidden=false}
function small(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),x=new Image();x.onerror=no;x.onload=()=>{const k=Math.min(1,1024/Math.max(x.width,x.height)),c=document.createElement('canvas');c.width=Math.round(x.width*k);c.height=Math.round(x.height*k);c.getContext('2d').drawImage(x,0,0,c.width,c.height);c.toBlob(ok,'image/jpeg',.8)};x.src=u})}
function yes(){document.querySelectorAll('.tsel').forEach(e=>e.hidden=false);$('fr').hidden=false;$('rs2').innerHTML='';$('fr').scrollIntoView({behavior:'smooth',block:'center'})}
function result(id,bad){
 $('rs2').innerHTML=`<div class="res ${bad?'bad':'ok'}">${cake(bad)}<h3>${t(bad?'fake':'real')}</h3>${bad?'':`<p class="ic">${t('ic')}</p>`}<p>${t('rn')}</p>${bad?`<div class="row" style="justify-content:center"><button class="btn p" onclick="repF('${id}')">${t('rp')}</button></div>`:''}</div>`;
 $('rs2').scrollIntoView({behavior:'smooth'});
}
function fin(id){
 let bad=0,ok=0;document.querySelectorAll('.tr').forEach(x=>{if(x.value==='2')bad++;if(x.value==='1')ok++});
 if(!bad&&!ok){$('rs2').innerHTML=`<p class="er">${t('dn')}</p>`;return}
 result(id,bad>0);
}
async function judge(id){
 $('rs2').innerHTML=`<p>${t('jg')}</p>`;
 let bad=+$('lk').value>0||+$('sm').value>0;const f=$('ph').files[0];
 if(f&&!bad){try{
  const sm=window.claude&&await claude.use('sample');if(!sm)throw 0;
  const L=await sm.limits();if(!L||!L.images)throw 0;
  const r=await sm(`Photo of ${$('fi').value} (${cat(id).n[0]}), an Indian food item. Look only for warning signs you can really see: odd colour, specks or dirt, layers, mould, bright dye, lumps, damaged or unclear label. Reply with one word only: WARNING or CLEAR.`,{images:[await small(f)],modelTier:'default'});
  if(/WARNING/i.test(r.text))bad=true;
 }catch(e){}}
 result(id,bad);
}
function repF(id){const v=$('fi').value,a=+$('lk').value,b=+$('sm').value;rep(id);$('item').value=v;$('rs').value='Looks adulterated';$('de').value='Looks: '+T.en.lo[a]+'. Smell: '+T.en.so[b]+'.'}
function rep(id){go('report');$('cat').value=id;items()}
function draft(r){
 const c=cat(r.cat);
 return `To,\nThe Food Safety Officer, ${r.di}, ${r.st}\n\nSubject: Complaint about suspected adulteration of ${r.item} (${c.n[0]})\n\nProduct: ${r.item}\nBrand: ${r.brand||'Not known'} (${r.pk})\nBought from: ${r.shop||'Not specified'}\nLocation: ${r.ar}, ${r.di}, ${r.st}${r.pin?' – '+r.pin:''}\nTest tried: ${r.te||'None'} (${r.rs})\n${r.de?'Details: '+r.de+'\n':''}\nI request an inspection and sampling. I have kept the packet, bill and photos.\n\nThank you.`;
}
function show(r){
 $('dr').value=draft(r);$('wa').href='https://wa.me/?text='+encodeURIComponent($('dr').value);$('cm').textContent='';
 $('db').hidden=false;$('db').scrollIntoView();
}
function save(e){
 e.preventDefault();const pin=$('pin').value.trim();
 if(pin&&!/^[1-9][0-9]{5}$/.test(pin)){$('pe').textContent=t('pe');$('pin').focus();return false}
 $('pe').textContent='';const g=i=>$(i).value.trim();
 const r={id:Date.now(),cat:g('cat'),item:g('item'),brand:g('brand'),pk:g('pk'),shop:g('shop'),st:g('st'),di:g('di'),ar:g('ar'),pin,te:g('te'),rs:g('rs'),de:g('de')};
 R.unshift(r);store();show(r);return false;
}
function cp(){
 const x=$('dr');x.select();
 const ok=()=>$('cm').textContent=t('cd'),no=()=>$('cm').textContent=t('cf');
 try{navigator.clipboard.writeText(x.value).then(ok,()=>document.execCommand('copy')?ok():no())}catch(e){try{document.execCommand('copy')?ok():no()}catch(y){no()}}
}
function view_(id){go('report');show(R.find(r=>r.id===id))}
function del(id){R=R.filter(r=>r.id!==id);store();renderMine()}
function renderMine(){
 $('ml').innerHTML=R.length?R.map(r=>`<div class="rep"><b>${E(r.item)}</b> – ${E(r.brand||'—')}<br><span style="color:var(--mu)">${E(r.ar)}, ${E(r.di)}, ${E(r.st)}</span><div class="row"><button class="btn" onclick="view_(${r.id})">${t('vw')}</button><button class="btn" onclick="del(${r.id})">${t('dl')}</button></div></div>`).join(''):`<p style="margin:0">${t('em')}</p>`;
}
paint();go('home');
</script>
</body>
